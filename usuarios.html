<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários · Controle de Processos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="container-fluid px-4">
  <div id="alertBox"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Usuários</h4>
  </div>

  <div class="alert alert-info small">
    Para criar um novo login, use o painel do Supabase: <strong>Authentication &gt; Users &gt; Add user</strong>
    (marque "Auto Confirm User"). Depois de criado, ele aparece aqui automaticamente e você pode
    ajustar nome, permissão de administrador e se está ativo.
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Nome</th><th>E-mail</th><th>Administrador</th><th>Ativo</th><th></th></tr>
        </thead>
        <tbody id="tabelaUsuarios">
          <tr><td colspan="5" class="text-center text-muted py-4">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
