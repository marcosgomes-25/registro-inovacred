<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processos · Controle de Processos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="container-fluid px-4">
  <div id="alertBox"></div>

  <div class="row g-3 mb-4 card-resumo">
    <div class="col-6 col-md-3">
      <div class="card text-bg-light shadow-sm">
        <div class="card-body">
          <div class="text-muted small">Em andamento</div>
          <div class="fs-3 fw-bold" id="resumoTotal">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card text-bg-light shadow-sm border-danger">
        <div class="card-body">
          <div class="text-muted small">Prazos vencidos</div>
          <div class="fs-3 fw-bold text-danger" id="resumoVencidos">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card text-bg-light shadow-sm border-warning">
        <div class="card-body">
          <div class="text-muted small">Prazos próximos (5 dias)</div>
          <div class="fs-3 fw-bold text-warning-emphasis" id="resumoProximos">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card text-bg-light shadow-sm border-success">
        <div class="card-body">
          <div class="text-muted small">Concluídos</div>
          <div class="fs-3 fw-bold text-success" id="resumoConcluidos">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <form id="filtroForm" class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label small">Buscar</label>
          <input type="text" id="filtroBusca" class="form-control"
                 placeholder="Identificação, cliente, matrícula, protocolo...">
        </div>
        <div class="col-md-3" id="colFiltroSituacao">
          <label class="form-label small">Situação</label>
          <select id="filtroSituacao" class="form-select">
            <option value="">Todas</option>
            <option value="Protocolado">Protocolado</option>
            <option value="Em análise">Em análise</option>
            <option value="Exigência pendente">Exigência pendente</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small">Responsável</label>
          <select id="filtroResponsavel" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Filtrar</button>
          <button type="button" id="btnLimpar" class="btn btn-outline-secondary">Limpar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-end mb-2">
    <ul class="nav nav-tabs border-bottom-0" id="abasProcessos" role="tablist">
      <li class="nav-item" role="presentation">
        <button type="button" class="nav-link active" id="abaAndamento" data-aba="andamento">
          Em andamento <span class="badge text-bg-secondary ms-1" id="contAndamento">0</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button type="button" class="nav-link" id="abaConcluidos" data-aba="concluidos">
          Concluídos <span class="badge text-bg-success ms-1" id="contConcluidos">0</span>
        </button>
      </li>
    </ul>
    <a href="processo-form.html" class="btn btn-primary btn-sm mb-1"><i class="bi bi-plus-lg"></i> Novo processo</a>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr id="cabecalhoTabela"></tr>
        </thead>
        <tbody id="tabelaProcessos">
          <tr><td colspan="8" class="text-center text-muted py-4">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/processos.js"></script>
</body>
</html>
