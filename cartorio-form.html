<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartório · Controle de Processos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="container-fluid px-4">
  <div id="alertBox"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 id="tituloPagina">Novo cartório</h4>
    <a href="cartorios.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form id="cartorioForm" novalidate>
        <input type="hidden" id="cartorioId">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" required>
          </div>
          <div class="col-md-4 d-flex align-items-center">
            <div class="form-check mt-4">
              <input type="checkbox" class="form-check-input" id="ativo" checked>
              <label class="form-check-label" for="ativo">Ativo</label>
            </div>
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cartorio-form.js"></script>
</body>
</html>
