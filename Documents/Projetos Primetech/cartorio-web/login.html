<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Controle de Processos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid px-4">
  <div id="alertBox"></div>
  <div class="row justify-content-center mt-5">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="text-center mb-3">
            <img src="img/logo.png" alt="Logo" style="max-width: 220px; width: 100%;" onerror="this.style.display='none'">
          </div>
          <h4 class="card-title mb-3 text-center">Controle de Processos</h4>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">E-mail</label>
              <input type="email" class="form-control" id="email" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="senha">Senha</label>
              <input type="password" class="form-control" id="senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btnEntrar">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/helpers.js"></script>
<script>
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = "processos.html";
})();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnEntrar");
  btn.disabled = true;
  btn.textContent = "Entrando...";

  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

  if (error) {
    document.getElementById("alertBox").innerHTML =
      '<div class="alert alert-danger alert-dismissible fade show">E-mail ou senha inválidos.' +
      '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
    btn.disabled = false;
    btn.textContent = "Entrar";
    return;
  }

  window.location.href = "processos.html";
});
</script>
</body>
</html>
