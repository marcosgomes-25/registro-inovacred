<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processo · Controle de Processos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="container-fluid px-4">
  <div id="alertBox"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 id="tituloPagina">Novo processo</h4>
    <a href="processos.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
  </div>

  <form id="processoForm" novalidate>
    <input type="hidden" id="processoId">

    <div class="card shadow-sm mb-3">
      <div class="card-header fw-semibold">Identificação</div>
      <div class="card-body row g-3">
        <div class="col-md-6">
          <label class="form-label">Identificação</label>
          <input type="text" class="form-control" id="identificacao" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Tipo</label>
          <select class="form-select" id="tipo">
            <option value="Registro">Registro</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Responsável pelo acompanhamento</label>
          <select class="form-select" id="responsavel_acompanhamento_id">
            <option value="">-</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Cliente</label>
          <input type="text" class="form-control" id="cliente">
        </div>
        <div class="col-md-6">
          <label class="form-label">Imóvel</label>
          <input type="text" class="form-control" id="imovel">
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-header fw-semibold">Entrada no cartório</div>
      <div class="card-body row g-3">
        <div class="col-md-3">
          <label class="form-label">Data de protocolo</label>
          <input type="date" class="form-control" id="data_protocolo">
        </div>
        <div class="col-md-3">
          <label class="form-label">Nº do protocolo/prenotação</label>
          <input type="text" class="form-control" id="numero_protocolo">
        </div>
        <div class="col-md-3">
          <label class="form-label">Cartório</label>
          <select class="form-select" id="cartorio_id">
            <option value="">-</option>
          </select>
          <div class="form-text">
            <a href="cartorio-form.html" target="_blank">+ Cadastrar novo cartório</a>
          </div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Matrícula</label>
          <input type="text" class="form-control" id="matricula">
        </div>
        <div class="col-md-3">
          <label class="form-label">Banco</label>
          <input type="text" class="form-control" id="banco" placeholder="Ex: Caixa, Itaú, Bradesco...">
        </div>
        <div class="col-md-3">
          <label class="form-label">Data limite / próximo prazo</label>
          <input type="date" class="form-control" id="data_limite">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="em_analise">
            <label class="form-check-label" for="em_analise">Em análise</label>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-header fw-semibold">Observações</div>
      <div class="card-body">
        <textarea class="form-control" id="observacoes" rows="3"></textarea>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
    <a href="processos.html" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/processo-form.js"></script>
</body>
</html>
