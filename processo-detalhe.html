<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhe do processo · Controle de Processos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="container-fluid px-4">
  <div id="alertBox"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h4 class="mb-0" id="tituloProcesso">
        <span id="nomeProcesso"></span>
        <span class="badge text-bg-secondary align-middle" id="situacaoBadge"></span>
      </h4>
      <div class="text-muted" id="subtituloProcesso"></div>
    </div>
    <div class="d-flex gap-2">
      <a href="#" class="btn btn-outline-primary btn-sm" id="btnEditar"><i class="bi bi-pencil"></i> Editar</a>
      <button class="btn btn-outline-danger btn-sm" id="btnExcluir"><i class="bi bi-trash"></i> Excluir</button>
      <a href="processos.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold">Entrada no cartório</div>
        <div class="card-body">
          <dl class="row mb-0" id="dlEntrada"></dl>
          <div id="observacoesBox"></div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold">Conclusão</div>
        <div class="card-body">
          <form id="conclusaoForm">
            <div class="form-check mb-2">
              <input type="checkbox" class="form-check-input" id="registro_concluido">
              <label class="form-check-label fw-semibold" for="registro_concluido">Registro concluído</label>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small">Data do registro</label>
                <input type="date" class="form-control form-control-sm" id="data_registro">
              </div>
              <div class="col-md-6">
                <label class="form-label small">Nº do registro/averbação</label>
                <input type="text" class="form-control form-control-sm" id="numero_registro_averbacao">
              </div>
            </div>
            <div class="form-check mb-1">
              <input type="checkbox" class="form-check-input" id="matricula_atualizada_recebida">
              <label class="form-check-label" for="matricula_atualizada_recebida">Matrícula atualizada recebida</label>
            </div>
            <div class="form-check mb-1">
              <input type="checkbox" class="form-check-input" id="contrato_registrado_recebido">
              <label class="form-check-label" for="contrato_registrado_recebido">Contrato registrado recebido</label>
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" id="documento_enviado_caixa">
              <label class="form-check-label" for="documento_enviado_caixa">Documento enviado para a Caixa</label>
            </div>
            <button type="submit" class="btn btn-success btn-sm">Salvar conclusão</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mt-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span class="fw-semibold">Exigências</span>
      <a href="#" class="btn btn-primary btn-sm" id="btnNovaExigencia">
        <i class="bi bi-plus-lg"></i> Nova exigência
      </a>
    </div>
    <div class="table-responsive">
      <table class="table mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Responsável</th>
            <th>Documento necessário</th>
            <th>Envio da solução</th>
            <th>Cumprida</th>
            <th>Novo prazo</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabelaExigencias"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/processo-detalhe.js"></script>
</body>
</html>
