<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuário · Controle de Processos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="container-fluid px-4">
  <div id="alertBox"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Editar usuário</h4>
    <a href="usuarios.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form id="usuarioForm" novalidate>
        <input type="hidden" id="usuarioId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" disabled>
            <div class="form-text">O e-mail de login é gerenciado no painel do Supabase.</div>
          </div>
          <div class="col-md-3 d-flex align-items-center">
            <div class="form-check mt-4">
              <input type="checkbox" class="form-check-input" id="is_admin">
              <label class="form-check-label" for="is_admin">Administrador</label>
            </div>
          </div>
          <div class="col-md-3 d-flex align-items-center">
            <div class="form-check mt-4">
              <input type="checkbox" class="form-check-input" id="ativo">
              <label class="form-check-label" for="ativo">Ativo</label>
            </div>
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/usuario-form.js"></script>
</body>
</html>
